name: frederic
description: Ever set a fitness goal and quit halfway through? NeverSkip keeps you motivated all the way through and helps you build healthy behaviors.

publish_to: 'none'

version: 1.2.2+25100101

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  pocketbase: ^0.18.0

  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  flutter_native_splash: ^2.3.4
  flutter_launcher_icons: ^0.14.4
#  flutter_local_notifications: ^19.4.2

  dio: ^5.4.0
  hive: ^2.2.3
  async: ^2.11.0
  crypto: ^3.0.3
  get_it: ^9.2.1
  provider: ^6.0.5
  flutter_bloc: ^9.1.1
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  image: ^4.1.3
  lottie: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^1.1.1
  confetti: ^0.8.0
  screenshot: ^3.0.0
  animations: ^2.0.8
  fluttertoast: ^9.0.0
  image_picker: ^1.0.4
  url_launcher: ^6.2.5
  system_theme: ^3.1.2
  auto_size_text: ^3.0.0
  in_app_purchase: ^3.1.11
  cupertino_icons: ^1.0.6
  introduction_screen: ^4.0.0
  cached_network_image: ^3.3.0

  sheet:
    git:
      url: https://github.com/nextormer/modal_bottom_sheet.git
      path: sheet

  easy_localization: ^3.0.3
  easy_localization_loader: ^2.0.0

  date_format: ^2.0.7
  sentry_flutter: ^9.6.0


dev_dependencies:
#  integration_test:
#    sdk: flutter
#  test:
#  flutter_test:
#    sdk: flutter
  # dart_code_metrics: ^5.7.6

flutter_native_splash:
  background_image: "assets/icon/icon_background.png"
#  image: assets/icon/icon_foreground.png


flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/new.png"
  image_path_ios: "assets/icon/new.png"
  image_path_android: "assets/icon/new.png"
#  adaptive_icon_background: "assets/icon/icon_background.png"
#  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  assets:
    - assets/images/dumbbell_with_bg_blue.png
    - assets/images/dumbbell2.png
    - assets/images/login_illustration.png
    - assets/images/abdominal-bench.png
    - assets/images/Frederic_Goal.png
    - assets/images/introduction_screen_1.png
    - assets/images/introduction_screen_2.png
    - assets/images/introduction_screen_3.png
    - assets/images/google/google_logo_light.png
    - assets/images/Medaille.png
    - assets/translations/
    - assets/images/credits/felix.jpg
    - assets/images/credits/stefan.jpg
    - assets/images/social-share-insta-background.jpg

  fonts:
    - family: ExtraIcons
      fonts:
        - asset: assets/fonts/ExtraIcons.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat/Montserrat-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Montserrat/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic
