<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <filter id="shadow-bottom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001a40" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="topFace-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d0e8ff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="outerBody-bottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#88bfff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#88bfff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow-bottom)">
    <!-- Bottom Base (Solid) -->
    <path d="M 170,95 A 70,35 0 1,1 30,95 A 70,35 0 1,1 170,95 Z" fill="#88bfff" fill-opacity="0.35"/>
    <!-- Outer Cylinder Body -->
    <path d="M 30,75 A 70,35 0 0,0 170,75 L 170,95 A 70,35 0 0,1 30,95 Z" fill="url(#outerBody-bottom)"/>
    <!-- Bottom Rim Highlight -->
    <path d="M 30,95 A 70,35 0 0,0 170,95" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Top Face (Solid) -->
    <path d="M 170,75 A 70,35 0 1,1 30,75 A 70,35 0 1,1 170,75 Z" fill="url(#topFace-bottom)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.95"/>
    <!-- Soft Inner Bevel -->
    <ellipse cx="100" cy="75" rx="63" ry="31.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>
</svg>
